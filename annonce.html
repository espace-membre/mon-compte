<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection en cours...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top-color: #666;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p { font-size: 1.1rem; }
        a { color: #1a73e8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Redirection en cours...</p>

        <noscript>
            <p>JavaScript est requis pour la redirection automatique.</p>
            <p><a id="fallback-link" href="#">Cliquez ici pour continuer</a></p>
        </noscript>
    </div>

    <script>
    // ============================================================
    // CONFIGURATION - Modifier cette URL avant de deployer
    // ============================================================

    // URL complete vers redirect.php ou redirect-light.php (sans parametres)
    // redirect-light.php = pas de collecte IP (recommande pour emails)
    // redirect.php       = tracking complet (recommande pour Telegram, liens directs)
    var REDIRECT_URL = "https://votre-domaine.com/p/redirect-light.php";

    // ============================================================
    // NE PAS MODIFIER EN DESSOUS
    // ============================================================

    (function() {
        var params = window.location.search;
        window.location.replace(REDIRECT_URL + params);
    })();
    </script>
</body>
</html>
